#:schema node_modules/wrangler/config-schema.json
name = "app"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Cloudflare Cron Triggers ────────────────────────────────────────────────
# Hourly trigger for 90-day inactivity sweeper (delegates to Rust backend)
[triggers]
crons = ["0 * * * *"]

# ── Cloudflare Static Assets ────────────────────────────────────────────────
# Serves static assets, Next.js SPA export, and public files at edge
[assets]
directory = "./out"
binding = "ASSETS"

# ── Environment Variables ──────────────────────────────────────────────────
# BACKEND_URL must be configured via environment or secret:
# e.g., wrangler secret put BACKEND_URL
[vars]
RUST_LOG = "info"
