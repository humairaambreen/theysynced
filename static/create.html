<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheySynced - Create Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #f472b6;
            --bg-dark: #0f0f23;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border: #27273f;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            top: -150px;
            right: -150px;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, var(--secondary), var(--primary-light));
            bottom: -100px;
            left: -100px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(0, 30px) scale(0.95); }
            75% { transform: translate(-30px, -15px) scale(1.05); }
        }

        .navbar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .logout-btn:hover {
            border-color: var(--error);
            color: var(--error);
        }

        .main-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 32px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px -20px rgba(99, 102, 241, 0.3);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .card-icon svg {
            width: 30px;
            height: 30px;
            color: white;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .checkbox-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary-light);
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--success);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .session-info {
            background: var(--bg-input);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .session-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .session-info-row:last-child {
            margin-bottom: 0;
        }

        .session-info-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .session-info-value {
            font-family: monospace;
            background: rgba(99, 102, 241, 0.1);
            padding: 6px 12px;
            border-radius: 6px;
            color: var(--primary-light);
            font-size: 0.9rem;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--primary-light);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading .loading-spinner {
            display: inline-block;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 16px 20px;
            }

            .main-container {
                margin: 30px auto;
            }

            .page-header h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <nav class="navbar">
        <a href="/create" class="nav-logo"> TheySynced</a>
        <div class="nav-actions">
            <a href="/create" class="nav-link active">Create</a>
            <a href="/join" class="nav-link">Join</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="main-container">
        <div class="page-header">
            <h1>Create a Workspace</h1>
            <p>Start a new collaborative session and invite others to join</p>
        </div>

        <div class="card">
            <div class="card-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
            </div>
            <h2>New Workspace</h2>
            <p>Create a real-time collaborative canvas where you can draw, write, and see everyone's cursors live.</p>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <div id="session-details" style="display: none;">
                <div class="session-info">
                    <div class="session-info-row">
                        <span class="session-info-label">Session ID</span>
                        <div>
                            <span id="created-session-id" class="session-info-value"></span>
                            <button class="copy-btn" onclick="copyToClipboard('created-session-id')">📋</button>
                        </div>
                    </div>
                    <div class="session-info-row">
                        <span class="session-info-label">Link</span>
                        <div>
                            <span id="created-link" class="session-info-value"></span>
                            <button class="copy-btn" onclick="copyToClipboard('created-link')">📋</button>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="goToSession()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                    Enter Workspace
                </button>
            </div>

            <form id="create-form" onsubmit="createSession(event)">
                <div class="form-group">
                    <label for="workspace-name">Workspace Name</label>
                    <input type="text" id="workspace-name" placeholder="My Awesome Project" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span class="loading-spinner"></span>
                    Create Workspace
                </button>
            </form>
        </div>
    </div>

    <script>
        // Check auth
        const token = localStorage.getItem('theysynced_token');
        if (!token) {
            window.location.href = '/login';
        }

        let createdSessionId = null;

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.classList.add('show');
        }

        function hideError() {
            document.getElementById('error-message').classList.remove('show');
        }

        function showSuccess(message) {
            const el = document.getElementById('success-message');
            el.textContent = message;
            el.classList.add('show');
        }

        async function createSession(e) {
            e.preventDefault();
            hideError();

            const name = document.getElementById('workspace-name').value;
            const btn = e.target.querySelector('.btn');
            
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/session/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, token })
                });

                const data = await res.json();

                if (data.success) {
                    createdSessionId = data.session_id;
                    document.getElementById('created-session-id').textContent = data.session_id;
                    document.getElementById('created-link').textContent = `${window.location.origin}/session/${data.session_id}`;
                    
                    document.getElementById('create-form').style.display = 'none';
                    document.getElementById('session-details').style.display = 'block';
                    showSuccess('Workspace created! Share the link or session ID with your collaborators.');
                } else {
                    showError(data.message || 'Failed to create workspace');
                }
            } catch (err) {
                showError('Connection error. Please try again.');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                btn.textContent = '✓';
                setTimeout(() => btn.textContent = '📋', 1000);
            });
        }

        function goToSession() {
            if (createdSessionId) {
                window.location.href = `/session/${createdSessionId}`;
            }
        }

        function logout() {
            localStorage.removeItem('theysynced_token');
            localStorage.removeItem('theysynced_user_id');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
