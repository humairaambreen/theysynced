version: '3.8'

services:
  theysynced-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theysynced-os
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RUST_LOG=info
    volumes:
      - workspace_data:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  workspace_data:
    name: theysynced_workspace_data
    driver: local
