version: '3.8'

services:
  theysynced-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theysynced-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  theysynced-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theysynced-frontend
    command: ["npx", "next", "start", "-p", "3000"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - theysynced-backend
    restart: unless-stopped
